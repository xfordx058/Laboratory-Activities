<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css(lab2)/style.css" />
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-card-header">
                <h1>Create Account</h1>
                <p>Register a customer or seller account for secure session-based access.</p>
            </div>
            <p id="auth-status" class="auth-status"></p>
            <form id="register-form" action="#">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" name="username" minlength="8" maxlength="20" autocomplete="username" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" type="email" name="email" autocomplete="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" minlength="8" maxlength="72" autocomplete="new-password" placeholder="At least 8 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input id="confirm-password" type="password" name="confirmPassword" minlength="8" maxlength="72" autocomplete="new-password" placeholder="Repeat your password" required>
                </div>

                <div class="form-group">
                    <label for="role">Account Type</label>
                    <select id="role" name="role">
                        <option value="CUSTOMER">Customer</option>
                        <option value="SELLER">Seller</option>
                    </select>
                </div>

                <button type="submit" class="auth-submit">Sign Up</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
