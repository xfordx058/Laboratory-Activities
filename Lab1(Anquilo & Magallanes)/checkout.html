<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - iPhone Shop</title>
    <link rel="stylesheet" href="css(lab2)/style.css" />
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.png" alt="iPhoneShop Logo" class="logo">
        </div>
        <div class="nav-wrap">
            <nav class="navs">
                <ul class="nav-li">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="Cart.html">Cart (<span id="cart-count">0</span>)</a></li>
                    <li><a href="account.html">Account</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="checkout-page">
        <div class="checkout-header">
            <div>
                <h1>Checkout</h1>
                <p>Complete your shipping details and confirm your order.</p>
            </div>
            <a href="Cart.html" class="checkout-back-link">Back to Cart</a>
        </div>

        <p id="page-status" class="auth-status"></p>

        <div class="checkout-wrapper">
            <section class="checkout-process">
                <form id="checkout-form">
                    <fieldset>
                        <legend>Shipping Information</legend>

                        <div class="form-group">
                            <label for="full-name">Full Name *</label>
                            <input type="text" id="full-name" name="fullName" placeholder="Juan Dela Cruz" required>
                            <span class="error-message"></span>
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" placeholder="email@example.com" required>
                            <span class="error-message"></span>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" placeholder="09XXXXXXXXX" required>
                            <span class="error-message"></span>
                        </div>

                        <div class="form-group">
                            <label for="address">Street Address *</label>
                            <input type="text" id="address" name="address" placeholder="House number, street, barangay" required>
                            <span class="error-message"></span>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="city">City *</label>
                                <input type="text" id="city" name="city" placeholder="City" required>
                                <span class="error-message"></span>
                            </div>
                            <div class="form-group">
                                <label for="zip">ZIP Code *</label>
                                <input type="text" id="zip" name="zip" placeholder="1000" required>
                                <span class="error-message"></span>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Payment Method</legend>
                        <div class="payment-options">
                            <label class="payment-option" for="cod">
                                <input type="radio" name="payment" value="cod" id="cod" checked>
                                <span>
                                    <strong>Cash on Delivery</strong>
                                    <small>Pay when your order arrives.</small>
                                </span>
                            </label>
                            <label class="payment-option" for="card">
                                <input type="radio" name="payment" value="card" id="card">
                                <span>
                                    <strong>Credit Card</strong>
                                    <small>Card fields are for demo only.</small>
                                </span>
                            </label>
                        </div>

                        <div id="card-fields" style="display: none;">
                            <div class="form-group">
                                <label for="card-number">Card Number</label>
                                <input type="text" id="card-number" name="cardNumber" placeholder="1234 5678 9012 3456">
                                <span class="error-message"></span>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="expiry">Expiry (MM/YY)</label>
                                    <input type="text" id="expiry" name="expiry" placeholder="MM/YY">
                                    <span class="error-message"></span>
                                </div>
                                <div class="form-group">
                                    <label for="cvv">CVV</label>
                                    <input type="text" id="cvv" name="cvv" placeholder="123">
                                    <span class="error-message"></span>
                                </div>
                            </div>
                        </div>
                    </fieldset>

                    <button type="submit" class="checkout-submit">Place Order</button>
                </form>
            </section>

            <aside class="checkout-order-summary">
                <div class="summary-header">
                    <h2>Order Summary</h2>
                    <span>Secure session checkout</span>
                </div>
                <div id="order-items"></div>
                <div class="order-total">
                    <span>Total</span>
                    <strong id="order-total">PHP 0.00</strong>
                </div>
            </aside>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
