<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - iPhone Shop</title>
    <link rel="stylesheet" href="css(lab2)/style.css" />
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.png" alt="iPhoneShop Logo" class="logo">
        </div>
        <div class="nav-wrap">
            <nav class="navs">
                <ul class="nav-li">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="Cart.html">Cart (<span id="cart-count">0</span>)</a></li>
                    <li><a href="account.html">Account</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="checkout-wrapper">
        <section class="checkout-process">
            <h1>Checkout</h1>
            <form id="checkout-form">
                <fieldset>
                    <legend>Shipping Information</legend>
                    
                    <div class="form-group">
                        <label for="full-name">Full Name *</label>
                        <input type="text" id="full-name" name="fullName" required>
                        <span class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required>
                        <span class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required>
                        <span class="error-message"></span>
                    </div>

                    <div class="form-group">
                        <label for="address">Street Address *</label>
                        <input type="text" id="address" name="address" required>
                        <span class="error-message"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">City *</label>
                            <input type="text" id="city" name="city" required>
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="zip">ZIP Code *</label>
                            <input type="text" id="zip" name="zip" required>
                            <span class="error-message"></span>
                        </div>
                    </div>

                    <legend>Payment Method</legend>
                    <div class="payment-option">
                        <input type="radio" name="payment" value="cod" id="cod" checked>
                        <label for="cod">Cash on Delivery</label>
                    </div>
                    <div class="payment-option">
                        <input type="radio" name="payment" value="card" id="card">
                        <label for="card">Credit Card</label>
                    </div>

                    <div id="card-fields" style="display: none;">
                        <div class="form-group">
                            <label for="card-number">Card Number</label>
                            <input type="text" id="card-number" name="cardNumber" placeholder="1234 5678 9012 3456">
                            <span class="error-message"></span>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="expiry">Expiry (MM/YY)</label>
                                <input type="text" id="expiry" name="expiry" placeholder="MM/YY">
                                <span class="error-message"></span>
                            </div>
                            <div class="form-group">
                                <label for="cvv">CVV</label>
                                <input type="text" id="cvv" name="cvv" placeholder="123">
                                <span class="error-message"></span>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="add-cart-btn" style="width: 100%; margin-top: 20px;">Place Order</button>
                </fieldset>
            </form>
        </section>

        <aside class="checkout-order-summary">
            <h2>Order Summary</h2>
            <div id="order-items"></div>
            <div class="order-total">
                <strong>Total: <span id="order-total">₱0.00</span></strong>
            </div>
        </aside>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
