<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5 (Checkout)</title>
    <link rel="stylesheet" href="css(lab2)/style.css" />
</head>
<body>
    <header>
       <div class="logo-container">
<img src="images/logo.png" alt="iPhoneShop Logo" class="logo">
</div>
      <div class="nav-wrap">
        <nav class="navs">
          <ul class="nav-li">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="Cart.html">Cart</a></li>
            <li><a href="account.html">Profile</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <div class="checkout-wrapper">
    <section class="checkout-process">
        <fieldset>
            <legend>Checkout</legend>
            <form action="#">
                <label for="address">Shipping Address:</label><br>
                <input type="text" name="fullname" placeholder="Full Name" required><br><br>
                <input type="text" name="address" placeholder="Country" required><br><br>
                <input type="text" name="address" placeholder="Region" required><br><br>
                <input type="text" name="address" placeholder="Province" required><br><br>
                <input type="text" name="address" placeholder="Municipality" required><br><br>
                <input type="text" name="address" placeholder="Barangay" required><br><br>
                <input type="text" name="address" placeholder="Street Address" required><br><br>
                <input type="text" inputmode="numeric" placeholder="Zip Code" required><br><br>

                <!-- <label for="payment">Payment Method:</label><br>
                <select id="payment" name="payment" required>
                    <option value="creditcard">Credit Card</option>
                    <option value="paypal">PayPal</option>
                    <option value="cod">Cash on Delivery</option>
                </select><br><br> -->

                <form class="form">
                    <label for="payment">Payment Method:</label><br>
                    <input class="credit" type="radio" id="creditcard" name="payment" value="creditcard" required>
                    <label for="creditcard">Credit Card</label>
                    <input class="paypal" type="radio" id="paypal" name="payment" value="Paypal" required>
                    <label for="paypal">Paypal</label>
                </form>

                <input type="submit" value="Place Order">
            </form>
        </fieldset>
    </section>
    <aside class="checkout-order-summary">
        <h3>Order Summary</h3>
        <p>Subtotal: $45.00</p>
        <p>Shipping: Calculated at checkout</p>
        <p><strong>Total: $45.00</strong></p>
    </aside>
    </div>
</body>
</html>
