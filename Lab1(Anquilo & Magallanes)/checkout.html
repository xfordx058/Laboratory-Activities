<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 5 (Checkout)</title>
    <link rel="stylesheet" href="css(lab2)/style.css" />
</head>
<body>
    <header>
      <div id="logo">Logo</div>
      <div class="nav-wrap">
        <nav class="navs">
          <ul class="nav-li">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="Cart.html">Cart</a></li>
            <li><a href="account.html">Profile</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <div class="checkout-wrapper">
    <section class="checkout-process">
        <fieldset>
            <legend>Checkout</legend>
            <form action="#" id="checkout-form" novalidate>
                <label for="fullname">Shipping Address:</label><br>
                <input type="text" id="fullname" name="fullname" placeholder="Full Name" required><br><br>
                <input type="text" name="country" placeholder="Country" required><br><br>
                <input type="text" name="region" placeholder="Region" required><br><br>
                <input type="text" name="province" placeholder="Province" required><br><br>
                <input type="text" name="municipality" placeholder="Municipality" required><br><br>
                <input type="text" name="barangay" placeholder="Barangay" required><br><br>
                <input type="text" name="streetAddress" placeholder="Street Address" required><br><br>
                <input type="text" name="zipCode" inputmode="numeric" placeholder="Zip Code" required><br><br>

                <label for="payment">Payment Method:</label><br>
                <div class="payment-option">
                    <input class="credit" type="radio" id="creditcard" name="payment" value="creditcard" required>
                    <label for="creditcard">Credit Card</label>
                </div>
                <div class="payment-option">
                    <input class="paypal" type="radio" id="paypal" name="payment" value="paypal" required>
                    <label for="paypal">Paypal</label>
                </div>
                <p id="checkout-feedback" class="field-error"></p>
                <input type="submit" value="Place Order">
            </form>
        </fieldset>
    </section>
    <aside class="checkout-order-summary">
        <h3>Order Summary</h3>
        <p>Subtotal: $45.00</p>
        <p>Shipping: Calculated at checkout</p>
        <p><strong>Total: $45.00</strong></p>
    </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
