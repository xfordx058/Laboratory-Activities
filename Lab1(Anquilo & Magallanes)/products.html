<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link rel="stylesheet" href="css(lab2)/style.css" />
  </head>
  <body>
    <header>
       <div class="logo-container">
<img src="images/logo.png" alt="iPhoneShop Logo" class="logo">
</div>
      <div class="nav-wrap">
        <nav class="navs">
          <ul class="nav-li">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="Cart.html">Cart</a></li>
            <li><a href="account.html">Profile</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main class="products-page-layout">

        <aside class="filter-panel">
  <form>
    <fieldset>
      <legend>Filter Products</legend>

      <h3>Storage Type</h3>
      <label>
        <input type="checkbox" name="storage" value="8-256">
        8GB / 256GB
      </label><br>

      <label>
        <input type="checkbox" name="storage" value="4-128">
        4GB / 128GB
      </label>

      <h3>Brand</h3>
      <label>
        <input type="radio" name="brand" value="samsung">
        Samsung
      </label><br>

      <label>
        <input type="radio" name="brand" value="iphone">
        iPhone
      </label><br>

      <label>
        <input type="radio" name="brand" value="tecno">
        Tecno
      </label>

    </fieldset>
  </form>
</aside>


      <section class="products">

        <article class="product-card">

          <div class="img-product">
            <img src="images/ip002.jfif" alt="Iphone12" />
          </div>

          <h3>Iphone 13</h3>
          <p class="info"> iPhone 13 (released 2021)</p>
          
          <div>
            <span class="price">₱59999</span>
            <a href="details.html">View Details</a>
            <button type="button" class="add-cart-btn">Add to Cart</button>
          </div>

        </article>

      </section>

    </main>
  </body>
</html>
