
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - iPhone Shop</title>
    <link rel="stylesheet" href="css(lab2)/style.css" />
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.png" alt="iPhoneShop Logo" class="logo">
        </div>
        <div class="nav-wrap">
            <nav class="navs">
                <ul class="nav-li">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="Cart.html">Cart (<span id="cart-count">0</span>)</a></li>
                    <li><a href="account.html">Account</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <h1 class="account-greeting" id="user-greeting">Welcome!</h1>
        
        <section class="account-stats">
            <div class="stat-card">
                <h3>Total Orders</h3>
                <p id="total-orders">0</p>
            </div>
            <div class="stat-card">
                <h3>Member Since</h3>
                <p>2026</p>
            </div>
        </section>

        <section id="purchase-history">
            <h2>Order History</h2>
            <div id="orders-container"></div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
