<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Details - iPhone Shop</title>
    <link rel="stylesheet" href="css(lab2)/style.css" />
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.png" alt="iPhoneShop Logo" class="logo">
        </div>
        <div class="nav-wrap">
            <nav class="navs">
                <ul class="nav-li">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="Cart.html">Cart (<span id="cart-count">0</span>)</a></li>
                    <li><a href="account.html">Account</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="details-layout">
        <section id="product-details"></section>

        <section>
            <h2>Technical Specifications</h2>
            <div class="table-wrap">
                <table id="specs-table">
                 <!-- table content will be generated by JavaScript -->
                </table>
            </div>

            <form id="add-to-cart-form">
                <h3>Purchase</h3>
                <div class="form-group">
                    <label for="qnty">Quantity</label>
                    <input type="number" id="qnty" min="1" value="1" required>
                </div>
                <button type="submit" class="add-cart-btn" data-action="add-to-cart">Add to Cart</button>
            </form>
        </section>

         <section class="reviews">
            <h3>Reviews</h3>
        <blockquote>
            <p>"My favorite new still-photography mode, though, is Macro  available only on the iPhone 17 and 17 Pro Max"</p>
             <footer>- <cite>Len Edgerly, Verified Purchaser</cite></footer>
        </blockquote>

      </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
