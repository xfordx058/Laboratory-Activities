<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="css(lab2)/style.css" />
</head>
<body>
    <header>
       <div class="logo-container">
<img src="images/logo.png" alt="iPhoneShop Logo" class="logo">
</div>
      <div class="nav-wrap">
        <nav class="navs">
          <ul class="nav-li">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="Cart.html">Cart</a></li>
            <li><a href="account.html">Profile</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="signup-form">
        <fieldset>
            <legend>Sign Up</legend>
            <p id="auth-status" class="auth-status"></p>
            <form id="register-form" action="#">
                <label for="username">Username:</label><br>
                <input id="username" type="text" name="username" minlength="8" maxlength="20" placeholder="Enter your username" required><br><br>

                <label for="email">Email:</label><br>
                <input id="email" type="email" name="email" placeholder="Enter your email" required><br><br>

                <label for="password">Password:</label><br>
                <input id="password" type="password" name="password" minlength="8" maxlength="72" placeholder="Enter your password" required><br><br>

                <label for="confirm-password">Confirm Password:</label><br>
                <input id="confirm-password" type="password" name="confirmPassword" minlength="8" maxlength="72" placeholder="Confirm your password" required><br><br>

                <label for="role">Account Type:</label><br>
                <select id="role" name="role">
                    <option value="CUSTOMER">Customer</option>
                    <option value="SELLER">Seller</option>
                </select><br><br>

                <input type="submit" value="Sign Up">
            </form>
            <p>Already have an account? <a href="login.html">Log in</a></p>
        </fieldset>
    </section>
    <script src="js/script.js"></script>
</body>
</html>
