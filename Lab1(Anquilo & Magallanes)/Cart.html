<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>task 4 (Cart)</title>
    <link rel="stylesheet" href="css(lab2)/style.css" />
  </head>
  <body>
    <header>
      <div class="logo-container">
<img src="images/logo.png" alt="iPhoneShop Logo" class="logo">
</div>
      <div class="nav-wrap">
        <nav class="navs">
          <ul class="nav-li">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="Cart.html">Cart</a></li>
            <li><a href="account.html">Profile</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="Cart">
      <h1>Shopping Cart</h1>
      <div class="cart-items">
      <ul>
        <li>
          <img src="images/Galaxy A23 5g.jpg" alt="Samsung Galaxy A23 5G" />
          <h3>Samsung Galaxy A23 5G</h3>
          <span>$10.00</span>
          <input type="number" value="1" placeholder="Quantity" />
        </li>

        <li>
          <img src="images/Samsung M53 5G.webp" alt="Samsung Galaxy M53 5g" />
          <h3>Samsung Galaxy M53 5g</h3>
          <span>$15.00</span>
          <input type="number" value="1" placeholder="Quantity" />
        </li>

        <li>
          <img src="images/Galaxy Note5.jpg" alt="Samsung Galaxy Note5" />
          <h3>Samsung Galaxy Note5</h3>
          <span>$20.00</span>
          <input type="number" value="1" placeholder="Quantity" />
        </li>
      </ul>
      </div>
      <section class="subtotal-content">
        <span class="subtotal-price">Subtotal: $00.00</span><br />
        <a href="checkout.html" class="Proceed-btn">Proceed to Checkout</a>
      </section>
      <section class="message">
        <p>"Your Cart is Currently Empty"</p>
      </section>
    </section>
  </body>
</html>
